name: Validate skills and packaging

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Fetch versioned portable manifest schema
        run: curl --fail --silent --show-error --location https://agent-plugins.org/schemas/1.0.0/plugin.schema.json --output "$RUNNER_TEMP/plugin.schema.json"
      - name: Validate repository and manifest
        run: python scripts/validate_repo.py --schema "$RUNNER_TEMP/plugin.schema.json"
      - name: Exercise timing and packaging regressions
        run: python -m unittest discover -s tests -v
